<title>TorSpo</title>
<style>
:root{
  --bg:#f2f7ef; --panel:#ffffff; --panel2:#eef4ea; --line:#dde3d6;
  --fg:#1b2c22; --muted:#68786d; --live:#c8402f; --dim:#9aa79d;
  --accent:#00703c; --accent2:#4c2c69; --tint:#e4f2e2;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 12% -12%, var(--tint) 0%, transparent 62%),
    var(--bg);
  color:var(--fg);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:rgba(245,247,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#accentbar{height:4px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,var(--accent2) 100%)}
@keyframes swapin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view.swap{animation:swapin .38s ease}
@media (prefers-reduced-motion:reduce){#view.swap{animation:none}}
body.wide .bar,body.wide main{max-width:none}
.bar{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand #home{display:flex;align-items:center;gap:9px;padding:0}
.mark{width:30px;height:30px;display:block;transition:transform .45s ease;filter:drop-shadow(0 1px 3px rgba(0,90,45,.35))}
.brand #home:hover .mark{transform:rotate(30deg) scale(1.07)}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(94deg,#00703c 0%,#2f9e57 45%,#4c2c69 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{color:var(--muted);font-size:12.5px}
.brand #appver{color:var(--dim)}
.brand #crumb:not(:empty)::before{content:'· '}
.brand em{font-style:normal;font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.tab{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);transition:background-color .35s,border-color .35s,color .35s}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--accent2)}
.dot.live{background:var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--accent)}
main{max-width:1240px;margin:0 auto;padding:16px 16px 60px}
.sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--panel2)}
.sel{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
.hint{color:var(--muted);font-size:13px}
#splash{position:fixed;inset:0;z-index:60;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .45s ease}
#splash img{width:min(46vw,190px);height:auto;animation:bounce 1.5s ease-in-out infinite}
#splash b{font-size:23px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(94deg,#00703c 0%,#2f9e57 45%,#4c2c69 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#splash span{font-size:13px;color:var(--muted)}
#splash.gone{opacity:0;pointer-events:none}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-18px) rotate(14deg)}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}}
.page{max-width:640px}
.page .ttl{font-size:20px;margin:0 0 2px}
.page p{font-size:13.5px;color:var(--muted);margin:0 0 12px}
details.rel{border-left:2px solid var(--line);padding:0 0 0 12px;margin-bottom:8px}
details.rel summary{cursor:pointer;font-size:13.5px;font-weight:600;padding:3px 0;list-style:revert}
details.rel[open] summary{color:var(--accent)}
details.rel ul{margin:4px 0 8px;padding-left:17px;font-size:13px;color:var(--muted)}
details.rel li{margin:3px 0}
.tag{font-size:11px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 7px;margin-left:6px}
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.rank{list-style:none;margin:0;padding:0}
.rk{display:flex;align-items:center;gap:12px;padding:9px 14px;margin-bottom:5px;
  background-color:var(--panel);background-repeat:no-repeat;
  border:1px solid var(--line);border-radius:10px}
.rk .pos{width:26px;flex:0 0 auto;font-size:14px;font-weight:700;color:var(--dim);text-align:right}
.rk .who{flex:1;min-width:0;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.rk .pts{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--accent)}
.rk .tp{font-size:11px;font-weight:600;color:var(--accent2);border:1px solid var(--accent2);
  border-radius:999px;padding:1px 8px;white-space:nowrap}
.rk .tp.lv{color:var(--live);border-color:var(--live)}
.rk.pod{border-color:var(--accent2)}
.rk.pod .pos{color:var(--accent2);font-size:15px}
h3.sec{font-size:13px;color:var(--accent);margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,34,26,.45);display:flex;align-items:flex-start;justify-content:center;padding:56px 16px}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;padding:20px 22px;max-height:80vh;overflow:auto}
.sheet h2{margin:0;font-size:17px}
.sheet .ver{color:var(--accent2);font-size:13px;margin:2px 0 18px;font-weight:600}
.sheet h3{font-size:12.5px;margin:20px 0 10px;color:var(--dim);font-weight:600}
.sheet p{font-size:13px;color:var(--muted);margin:0 0 10px}
.rel{border-left:2px solid var(--line);padding-left:12px;margin-bottom:14px}
.rel.now{border-left-color:var(--accent)}
.dt{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.dt.w{font-weight:650}
.dt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt img{width:19px;height:13px;object-fit:cover;border-radius:2px}
.dt .sets{font-size:14px}
.st{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.st .lb{color:var(--dim);text-align:center;font-size:11.5px}
.st .a{text-align:right}
.meta{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.rel b{font-size:13.5px}
.rel ul{margin:4px 0 0;padding-left:17px;font-size:13px;color:var(--muted)}
.rel li{margin:3px 0}
.err{border:1px solid #e3c2bb;background:#fdf1ee;color:#8a2f1f;padding:12px 14px;border-radius:var(--r);font-size:14px}
.empty{color:var(--muted);padding:28px 4px}
.skel{color:var(--muted);padding:28px 4px}

/* ---------- Tableau (Tennis) ---------- */
.roundnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-4px 0 14px}
.roundnav b{font-size:12px;font-weight:600;color:var(--accent2);margin-right:2px}
.roundnav button{font-size:12.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.roundnav button:hover{border-color:var(--accent);color:var(--fg)}
.roundnav button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.zoom{display:flex;align-items:center;gap:4px;margin-left:auto}
.zoom button{min-width:30px}
.zoom span{font-size:12px;color:var(--dim);min-width:38px;text-align:center}
.draw{position:relative;overflow-x:auto;overflow-y:hidden;height:auto;padding:10px 10px 16px;cursor:grab;
  border:1px solid var(--line);border-radius:12px;background:var(--panel2);
  touch-action:pan-x pan-y;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.draw.grabbing{cursor:grabbing;user-select:none}
.sizer{position:relative}
.canvas{position:absolute;left:0;top:0;width:max-content;display:flex;align-items:stretch;gap:42px;transform-origin:0 0}
.canvas svg.links{position:absolute;left:0;top:0;pointer-events:none}
.col{flex:0 0 248px;display:flex;flex-direction:column}
.colhead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 7px;margin-bottom:8px;font-size:13px;font-weight:650;color:var(--accent);border-bottom:2px solid var(--accent)}
.colhead i{font-style:normal;color:var(--accent2);font-weight:600}
.slots{flex:1;display:flex;flex-direction:column;justify-content:space-around;height:var(--h)}
.m{position:relative;z-index:1;cursor:pointer;text-align:left;width:100%;font:inherit;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:var(--r);padding:9px 11px}
.m.is-live{border-left-color:var(--live);background:var(--panel2)}
.m.is-done{border-left-color:var(--accent)}
.m{transition:border-color .35s}
.mtop{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:7px}
.mtop .lv{color:var(--live);font-weight:650}
.p{display:flex;align-items:center;gap:7px;padding:3px 0;color:var(--dim)}
.p.w{color:var(--fg);font-weight:600}
.p.w .nm{color:var(--accent)}
.p.w .sets{color:var(--accent)}
.p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.p .sd{font-size:10.5px;color:var(--accent2);flex:0 0 auto}
.p img{width:17px;height:12px;object-fit:cover;border-radius:2px;flex:0 0 auto;opacity:.9}
.sets{display:flex;gap:5px;flex:0 0 auto;font-size:13px}
.sets s{text-decoration:none;position:relative;min-width:11px;text-align:right}
.sets sup{font-size:9px;color:var(--muted);top:-.5em}
.mfoot{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}

/* ---------- Liga ---------- */
.day{margin-bottom:22px}
.dayhead{font-size:13px;font-weight:650;color:var(--accent);padding:0 0 8px 9px;border-left:3px solid var(--accent);line-height:1.1;margin-bottom:6px}
.cdot{width:4px;height:22px;border-radius:2px;flex:0 0 auto;display:inline-block}
.tdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
.game{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:8px}
.game.is-live{border-left-color:var(--live);background:var(--panel2)}
.game.is-done{border-left-color:var(--accent)}
.game{transition:border-color .35s}
.grow{display:grid;grid-template-columns:64px 1fr auto 1fr;gap:10px;align-items:center}
.when{font-size:12px;color:var(--muted)}
.when.lv{color:var(--live);font-weight:650}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team.a{justify-content:flex-end;text-align:right}
.team img{width:22px;height:22px;object-fit:contain;flex:0 0 auto}
.team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.score{font-size:17px;font-weight:700;letter-spacing:.02em;padding:2px 11px;background:var(--tint);border-radius:8px;transition:background-color .35s}
.score.pre{font-size:13px;font-weight:500;color:var(--muted);background:none}
.venue{margin-top:8px;font-size:11.5px;color:var(--dim);padding-left:74px}
.ticker{margin:10px 0 2px 74px;border-left:2px solid var(--line);padding-left:12px}
.tk{display:grid;grid-template-columns:38px 20px 1fr;gap:8px;font-size:12.5px;color:var(--muted);padding:3px 0}
.tk b{color:var(--fg);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td:first-child{color:var(--muted);width:28px}
.tbl tr:hover td{background:var(--panel)}
.tbl .tm{display:flex;align-items:center;gap:8px}
.tbl .tm img{width:18px;height:18px;object-fit:contain}
.tbl .r{text-align:right}
.tbl .land{color:var(--muted);font-size:12px;letter-spacing:.04em;white-space:nowrap}
@media (max-width:640px){
  .grow{grid-template-columns:52px 1fr auto 1fr;gap:6px}
  .team img{width:18px;height:18px}
  .team span{font-size:12.5px}
  .venue,.ticker{padding-left:0;margin-left:0}
  .tbl .hide{display:none}
}
</style>
</head>

async function getJSON(url, ms=12000){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(url, {cache:'no-store', signal:ctl.signal});
    if(!r.ok) throw new Error(`${r.status} bei ${url.split('?')[0]}`);
    return await r.json();
  } finally { clearTimeout(t); }
}

function tennisComps(ev){
  const out=[];
  const add=(c,g)=>{ if(c&&c.id) out.push({c, group:g}); };
  (ev.groupings||[]).forEach(g=>{
    const name = g.grouping?.displayName || g.grouping?.shortName || g.displayName || 'Wettbewerb';
    (g.competitions||[]).forEach(c=>add(c,name));
  });
  (ev.competitions||[]).forEach(c=>add(c, c.type?.text || 'Wettbewerb'));
  return out;
}

const GROUP_DE = {
  "men's singles":'Herren Einzel', "women's singles":'Damen Einzel',
  "men's doubles":'Herren Doppel', "women's doubles":'Damen Doppel',
  "mixed doubles":'Mixed Doppel'
};
const groupDE = g => GROUP_DE[String(g).toLowerCase()] || g;

function rawRound(c){
  let r = c.round?.displayName || c.round?.name || c.notes?.[0]?.headline || c.type?.text || '';
  if(!r) r = 'Runde';
  if(r.includes(' - ')) r = r.split(' - ').pop();
  return r.trim();
}
function roundRank(r){
  const s = r.toLowerCase();
  if(/qualif/.test(s)) return 0;
  if(/\b(1st|first)\b/.test(s) || /of 128/.test(s)) return 1;
  if(/\b(2nd|second)\b/.test(s) || /of 64/.test(s)) return 2;
  if(/\b(3rd|third)\b/.test(s) || /of 32/.test(s)) return 3;
  if(/of 16|fourth|4th|achtel/.test(s)) return 4;
  if(/quarter|viertel/.test(s)) return 5;
  if(/semi|halb/.test(s)) return 6;
  if(/final|finale/.test(s)) return 7;
  return 3.5;
}
function roundDE(r){
  const s = r.toLowerCase();
  if(/qualif/.test(s)) return 'Qualifikation';
  if(/semi/.test(s)) return 'Halbfinale';
  if(/quarter/.test(s)) return 'Viertelfinale';
  if(/of 16|fourth round|4th round/.test(s)) return 'Achtelfinale';
  if(/final/.test(s)) return 'Finale';
  if(/\b(1st|first)\b|of 128/.test(s)) return '1. Runde';
  if(/\b(2nd|second)\b|of 64/.test(s)) return '2. Runde';
  if(/\b(3rd|third)\b|of 32/.test(s)) return '3. Runde';
  return r;
}

async function loadTennis(){
  const from = ymd(addDays(new Date(),-18)), to = ymd(addDays(new Date(),4));
  const jobs = state.sport.tours.map(t =>
    getJSON(`${API}tennis/${t.key}/scoreboard?dates=${from}-${to}`).then(d=>({tour:t.label,key:t.key,d}))
  );
  const res = await Promise.allSettled(jobs);
  if(res.every(r=>r.status==='rejected')) throw res[0].reason;

  const map = new Map();
  res.filter(r=>r.status==='fulfilled').forEach(({value})=>{
    (value.d.events||[]).forEach(ev=>{
      const name = ev.name || ev.shortName || 'Turnier';
      if(!map.has(name)) map.set(name,{name, groups:new Map(), seen:new Set(), live:0, last:0});
      const T = map.get(name);
      tennisComps(ev).forEach(({c,group})=>{
        if(T.seen.has(c.id)) return;
        T.seen.add(c.id);
        c.__tour = value.tour; c.__key = value.key; c.__event = name; c.__evid = ev.id;
        const g = groupDE(group);
        if(!T.groups.has(g)) T.groups.set(g,[]);
        T.groups.get(g).push(c);
        const st = c.status?.type?.state;
        if(st==='in') T.live++;
        const t = Date.parse(c.date||'')||0;
        if(t>T.last) T.last=t;
      });
    });
  });

  const list = [...map.values()].filter(t=>t.seen.size).sort((a,b)=>
    ((state.favs.has(b.name)?1:0)-(state.favs.has(a.name)?1:0)) || (b.live-a.live) || (b.last-a.last));
  state.tennis.tournaments = list;
  if(!state.tennis.pick || !list.some(t=>t.name===state.tennis.pick))
    state.tennis.pick = list.find(t=>state.favs.has(t.name))?.name || list[0]?.name || null;
  const cur = list.find(t=>t.name===state.tennis.pick);
  const groups = cur ? [...cur.groups.keys()] : [];
  if(!groups.includes(state.tennis.group)) state.tennis.group = groups.find(g=>/einzel|singles/i.test(g)) || groups[0] || null;
  state.hasLive = list.some(t=>t.live>0);
}

function deepArrays(d){
  const out=[];
  const visit=o=>{
    if(!o || typeof o!=='object') return;
    if(Array.isArray(o)){
      if(o.length && o.some(x=>x && typeof x==='object' && (x.athlete||x.competitor))) out.push(o);
      o.forEach(visit); return;
    }
    Object.values(o).forEach(visit);
  };
  visit(d); return out;
}
function parseRanks(d){
  const arr = deepArrays(d).sort((a,b)=>b.length-a.length)[0] || [];
  return arr.map((r,i)=>{
    const a = r.athlete || r.competitor?.athlete || r.competitor || {};
    return {
      rank: r.current ?? r.rank ?? r.currentRank ?? (i+1),
      name: a.displayName || a.fullName || a.shortName || '',
      flag: a.flag?.href || '',
      land: a.flag?.alt || a.citizenship || '',
      pts:  r.points ?? r.statistics?.[0]?.displayValue ?? r.displayValue ?? ''
    };
  }).filter(x=>x.name).slice(0,100);
}
async function ensureRanks(tour){

                `${API}tennis/${tour}/rankings`];
  let rows = [];

}

function parseScorers(d){
  let cats = d?.categories || d?.leaders?.categories || d?.leaders || [];
  if(!Array.isArray(cats)) cats = [cats];
  const pick = cats.find(c=>/goal|scor/i.test(`${c?.name||''} ${c?.displayName||''} ${c?.abbreviation||''}`)) || cats[0];
  const list = pick?.leaders || pick?.athletes || [];
  return (Array.isArray(list)?list:[]).map((l,i)=>({
    rank:i+1,
    name: l.athlete?.displayName || l.displayName || '',
    team: l.team?.displayName || l.athlete?.team?.displayName || '',
    val:  l.displayValue ?? l.value ?? ''
  })).filter(x=>x.name).slice(0,30);
}
// Weg 2: Core-API. Dort stehen nur Verweise, die Namen werden einzeln nachgeladen.
async function coreScorers(sp, y){
  const lg = sp.path.split('/')[1], sport = sp.path.split('/')[0];
  const base = `https://sports.core.api.espn.com/v2/sports/${sport}/leagues/${lg}/seasons/${y}/types/1/leaders`;
  const d = await getJSON(base);
  const cats = d?.categories || [];
  const cat = cats.find(c=>/goals/i.test(`${c.name||''} ${c.displayName||''}`) && !/assist|against/i.test(`${c.name||''}`)) || cats[0];
  const list = (cat?.leaders || []).slice(0,25);
  const rows = await Promise.all(list.map(async (l,i)=>{
    let name = '', team = '';
    try{
      const a = await getJSON(l.athlete.$ref.replace('http://','https://'));
      name = a.displayName || a.fullName || '';
      if(a.team?.$ref){ try{ const t = await getJSON(a.team.$ref.replace('http://','https://')); team = t.displayName||''; }catch(e){} }
    }catch(e){}
    return { rank:i+1, name, team, val: l.displayValue ?? l.value ?? '' };
  }));
  return rows.filter(r=>r.name);
}

async function ensureScorers(sp){
  if(state.scorers.has(sp.id)) return;
  state.scorers.set(sp.id, null);
  const y = seasonYear();
  const urls = [`https://site.web.api.espn.com/apis/common/v3/sports/${sp.path}/leaders?season=${y}&seasontype=1&limit=30`,
                `https://site.web.api.espn.com/apis/common/v3/sports/${sp.path}/leaders?limit=30`,
                `${API}${sp.path}/leaders`];
  let rows = [];
  for(const u of urls){ try{ const d = await getJSON(u); rows = parseScorers(d); if(rows.length) break; }catch(e){} }
  if(!rows.length){ try{ rows = await coreScorers(sp, y); }catch(e){} }
  if(!rows.length && seasonYear() !== new Date().getFullYear()){
    try{ rows = await coreScorers(sp, new Date().getFullYear()); }catch(e){}
  }
  state.scorers.set(sp.id, rows); render();
}

/* ========================= 6) Render: Tennis ========================= */
function setBox(ls){
  const v = ls?.value ?? ls?.displayValue ?? '';
  const tb = ls?.tiebreak ?? ls?.tieBreak;
  return `<s>${esc(v)}${tb!=null&&tb!==''?`<sup>${esc(tb)}</sup>`:''}</s>`;
}
function playerName(cp){
  if(cp.athlete) return cp.athlete.shortName || cp.athlete.displayName || 'TBD';
  const roster = cp.roster || cp.athletes;
  if(Array.isArray(roster) && roster.length)
    return roster.map(a=>{const x=a.athlete||a; return x.shortName||x.displayName||'?';}).join(' / ');
  return cp.team?.displayName || 'noch offen';
}
function playerFlag(cp){
  const f = cp.athlete?.flag?.href || cp.flag?.href;
  return f ? `<img src="${esc(f)}" alt="" loading="lazy" onerror="this.remove()">` : '';
}
function courtOf(c){
  return c.court?.fullName || c.court?.displayName || c.court?.name
      || c.venue?.fullName || c.venue?.displayName || c.note || '';
}
function matchCard(c){
  const st = c.status?.type?.state, live = st==='in', done = st==='post' || c.status?.type?.completed;
  const d = c.date ? new Date(c.date) : null;
  const stamp = d ? `${fmtDay(d).replace(/,.*?(\d)/,' $1')}, ${fmtTime(d)} Uhr` : 'Termin offen';
  const when = live ? `<span class="lv">● live</span> ${esc(stamp)}`
             : done ? `beendet · ${esc(stamp)}` : esc(stamp);
  const rows = (c.competitors||[]).map(cp=>{
    const sets = (cp.linescores||[]).map(setBox).join('');
    const seed = cp.seed || cp.athlete?.seed;
    return `<div class="p ${cp.winner?'w':''}">
      ${playerFlag(cp)}
      <span class="nm">${esc(playerName(cp))}</span>
      ${seed?`<span class="sd">(${esc(seed)})</span>`:''}
      <span class="sets num">${sets}</span>
    </div>`;
  }).join('');
  const note = c.status?.type?.detail && !done ? c.status.type.detail : '';
  const venue = courtOf(c);
  return `<button type="button" class="m ${live?'is-live':''} ${done?'is-done':''}" data-mid="${esc(c.id)}" data-parent="${esc(c.__parent||'')}">
    <div class="mtop"><span>${when}</span><span>${esc(c.__tour||'')}</span></div>
    ${rows}
    ${(venue||note)?`<div class="mfoot">${esc(venue||note)}</div>`:''}
  </button>`;
}

function nameKey(cp){
  const n = playerName(cp);
  return (!n || n==='noch offen' || /^tbd$/i.test(n)) ? '' : n.toLowerCase();
}
// Bringt jede Runde in Turnierbaum-Reihenfolge: ein Match steht dort,
// wo sein Sieger in der naechsten Runde weiterspielt.
function linkRounds(rounds){
  for(let i=rounds.length-2;i>=0;i--){
    const next = rounds[i+1].list, idx = new Map();
    next.forEach((m,pi)=>(m.competitors||[]).forEach((cp,si)=>{
      const k=nameKey(cp); if(k && !idx.has(k)) idx.set(k,{p:pi,s:si});
    }));
    rounds[i].list.forEach(m=>{
      let best=null;
      (m.competitors||[]).forEach(cp=>{
        const h=idx.get(nameKey(cp));
        if(h && (!best || h.p<best.p || (h.p===best.p && h.s<best.s))) best=h;
      });
      m.__p = best?best.p:9999; m.__s = best?best.s:9;
      m.__parent = best ? next[best.p].id : '';
    });
    rounds[i].list.sort((x,y)=> (x.__p-y.__p) || (x.__s-y.__s)
      || ((Date.parse(x.date||'')||0)-(Date.parse(y.date||'')||0)));
  }
  if(rounds.length) rounds[rounds.length-1].list.forEach(m=>{ m.__parent=''; });
}

function drawLinks(W,H){
  const canvas = document.querySelector('.canvas'); if(!canvas) return;
  const svg = canvas.querySelector('svg.links'); if(!svg) return;
  const cards = [...canvas.querySelectorAll('.m')];
  const pos = new Map(cards.map(c=>[c.dataset.mid,
    {x:c.offsetLeft, y:c.offsetTop, w:c.offsetWidth, h:c.offsetHeight}]));
  let d='';
  cards.forEach(c=>{
    const pid = c.dataset.parent;
    if(!pid || !pos.has(pid)) return;
    const A = pos.get(c.dataset.mid), B = pos.get(pid);
    const x1=A.x+A.w, y1=A.y+A.h/2, x2=B.x, y2=B.y+B.h/2, mx=x1+(x2-x1)/2;
    d += `M${x1} ${y1}H${mx}V${y2}H${x2} `;
  });
  svg.setAttribute('width', W || canvas.offsetWidth);
  svg.setAttribute('height', H || canvas.offsetHeight);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
}

function applyScale(z){
  const draw = document.querySelector('.draw'); if(!draw) return;
  const canvas = draw.querySelector('.canvas'), sizer = draw.querySelector('.sizer');
  if(!canvas || !sizer) return;
  z = Math.min(2, Math.max(0.25, Math.round(z*100)/100));
  canvas.style.transform = `scale(${z})`;
  sizer.style.width = (state.dw*z)+'px'; sizer.style.height = (state.dh*z)+'px';
  state.zoomEff = z;
  const lbl = document.querySelector('#zoomlbl'); if(lbl) lbl.textContent = Math.round(z*100)+'%';
  return z;
}

// Zoomen um einen festen Punkt herum, wie bei einer Karte.
function zoomAt(z, ax, ay){
  const draw = document.querySelector('.draw'); if(!draw) return;
  const z1 = state.zoomEff || 1;
  const cx = (draw.scrollLeft + ax)/z1, cy = (draw.scrollTop + ay)/z1;
  state.zoom = applyScale(z);
  draw.scrollLeft = cx*state.zoomEff - ax;
  draw.scrollTop  = cy*state.zoomEff - ay;
}

function layoutDraw(){
  const draw = document.querySelector('.draw'); if(!draw) return;
  const canvas = draw.querySelector('.canvas'); if(!canvas) return;
  canvas.style.transform = 'scale(1)';
  state.dw = canvas.offsetWidth; state.dh = canvas.offsetHeight;
  applyScale(state.zoom == null
    ? Math.min(1, Math.max(0.3, (draw.clientWidth - 24)/state.dw))
    : state.zoom);
  drawLinks(state.dw, state.dh);
}

function enableGestures(draw){
  // Ziehen mit der Maus
  let down=false, x0=0, y0=0, l0=0, t0=0;
  const pts = new Map(); let pinch = null;

  draw.addEventListener('pointerdown', e=>{
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size === 2){
      const [a,b] = [...pts.values()];
      pinch = { d: Math.hypot(a.x-b.x, a.y-b.y) || 1, z: state.zoomEff };
      down = false; draw.classList.remove('grabbing');
      return;
    }
    if(e.pointerType !== 'mouse' || e.target.closest('a,button')) return;
    down=true; x0=e.clientX; y0=e.clientY; l0=draw.scrollLeft; t0=draw.scrollTop;
    draw.classList.add('grabbing');
  });

  draw.addEventListener('pointermove', e=>{
    if(pts.has(e.pointerId)) pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && pts.size === 2){                       // zwei Finger: aufziehen und zusammenziehen
      const [a,b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      const r = draw.getBoundingClientRect();
      zoomAt(pinch.z * (d/pinch.d), (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top);
      e.preventDefault();
      return;
    }
    if(down){ draw.scrollLeft = l0-(e.clientX-x0); }
  });

  ['pointerup','pointercancel','pointerleave'].forEach(ev=>draw.addEventListener(ev, e=>{
    pts.delete(e.pointerId);
    if(pts.size < 2) pinch = null;
    down=false; draw.classList.remove('grabbing');
  }));

  // Mausrad zoomt, weil das Tableau ein eigener Bereich mit eigenem Scrollen ist
  draw.addEventListener('wheel', e=>{
    if(!(e.ctrlKey || e.metaKey)) return;      // ohne Strg scrollt die Seite normal weiter
    e.preventDefault();
    const r = draw.getBoundingClientRect();
    const step = e.deltaMode === 1 ? e.deltaY*16 : e.deltaY;
    zoomAt(state.zoomEff * Math.exp(-step*0.0015), e.clientX-r.left, e.clientY-r.top);
  }, {passive:false});

  draw.addEventListener('scroll', ()=>{
    state.scrollLeft = draw.scrollLeft; state.scrollTop = draw.scrollTop;
  }, {passive:true});
}

function nameSig(n){
  const parts = String(n||'').replace(/[.]/g,'').trim().split(/\s+/);
  if(parts.length < 2) return '';
  return (parts[0][0]||'').toLowerCase() + '|' + parts[parts.length-1].toLowerCase();
}
// Wer aus der Rangliste ist im gewaehlten Turnier noch dabei?
function activeMap(){
  const m = new Map();
  const T = state.tennis.tournaments.find(t=>t.name===state.tennis.pick);
  if(!T) return m;
  T.groups.forEach(list=>list.forEach(c=>{
    const rk = roundRank(rawRound(c)), live = c.status?.type?.state==='in';
    (c.competitors||[]).forEach(cp=>{
      const sig = nameSig(playerName(cp)); if(!sig) return;
      const cur = m.get(sig);
      if(!cur || rk > cur.rk) m.set(sig, {rk, live, round: roundDE(rawRound(c)), out: cp.winner===false && !live});
      else if(live) cur.live = true;
    });
  }));
  return m;
}

function rankTable(rows){
  const toNum = v => Number(String(v).replace(/[^0-9]/g,'')) || 0;
  const top = Math.max(1, ...rows.map(r=>toNum(r.pts)));
  const act = activeMap();
  return `<ol class="rank">${rows.map(r=>{
    const pos = Number(r.rank) || 0;
    const w = Math.max(1.5, toNum(r.pts)/top*100).toFixed(1);
    const a = act.get(nameSig(r.name));
    const badge = a ? `<span class="tp ${a.live?'lv':''}">${a.live?'● live · ':''}${esc(a.round)}</span>` : '';
    return `<li class="rk${pos<=3?' pod':''}"
      style="background-image:linear-gradient(90deg,var(--tint) 0 ${w}%,transparent ${w}% 100%)">
      <span class="pos num">${esc(r.rank)}</span>
      <span class="who">${esc(r.name)}${badge}</span>
      <span class="pts num">${esc(r.pts)}</span>
    </li>`;
  }).join('')}</ol>`;
}

function slamTable(list){
  return `<table class="tbl"><thead><tr><th>#</th><th>Name</th><th>Land</th><th class="r">Titel</th></tr></thead>
    <tbody>${list.map(([n,c,t,act],i)=>`<tr><td class="num">${i+1}</td>
      <td>${esc(n)}${act?' <span class="sd" style="color:var(--accent)">aktiv</span>':''}</td>
      <td class="land">${esc(c)}</td>
      <td class="r num"><b>${t}</b></td></tr>`).join('')}</tbody></table>`;
}

function renderTennis(){
  const sub = $('#sub'); sub.innerHTML='';
  const view = $('#view'); view.className='';
  [['draw','Tableau'],['ranking','Rangliste'],['slams','Grand Slams']].forEach(([k,l])=>{
    const b=el('button','chip',l); b.setAttribute('aria-pressed', state.tennis.view===k);
    b.onclick=()=>{ state.tennis.view=k; render(); }; sub.appendChild(b);
  });

  if(state.tennis.view==='ranking'){
    state.sport.tours.forEach(t=>{
      const b=el('button','chip',t.label); b.setAttribute('aria-pressed', state.tennis.rankTour===t.key);
      b.onclick=()=>{ state.tennis.rankTour=t.key; render(); }; sub.appendChild(b);
    });
    const tour = state.tennis.rankTour, rows = state.ranks.get(tour);
    if(rows === undefined){ ensureRanks(tour); view.className='skel'; view.textContent='Rangliste wird geladen…'; return; }
    if(rows === null){ view.className='skel'; view.textContent='Rangliste wird geladen…'; return; }

  }

  if(state.tennis.view==='slams'){
    view.innerHTML = `<div class="two">
      <div><h3 class="sec">Herren, Rekordhalter</h3>${slamTable(SLAMS.herren)}
        <h3 class="sec" style="margin-top:22px">Herren, aktive Spieler</h3>${slamTable(SLAMS.herrenAktiv)}</div>
      <div><h3 class="sec">Damen, Rekordhalterinnen</h3>${slamTable(SLAMS.damen)}
        <h3 class="sec" style="margin-top:22px">Damen, aktive Spielerinnen</h3>${slamTable(SLAMS.damenAktiv)}</div></div>
      <p class="hint" style="margin-top:14px">Stand: ${esc(SLAMS.stand)}. Diese Liste pflegst du im Script von Hand unter <code>SLAMS</code>.</p>`;

  }

  const T = state.tennis.tournaments.find(t=>t.name===state.tennis.pick);

  const sel = el('select','sel');
  state.tennis.tournaments.forEach(t=>{
    const o=el('option'); o.value=t.name;
    o.textContent = (state.favs.has(t.name)?'★ ':'') + t.name + (t.live?`  (${t.live} live)`:'');
    if(t.name===state.tennis.pick) o.selected=true; sel.appendChild(o);
  });
  sel.onchange = ()=>{ state.tennis.pick=sel.value;
    const g=[...state.tennis.tournaments.find(t=>t.name===sel.value).groups.keys()];
    state.tennis.group = g.find(x=>/einzel|singles/i.test(x))||g[0];
    state.tennis.from = null; state.scrollLeft = 0; render(); };
  sub.appendChild(sel);

  const fav = el('button','chip', (state.favs.has(T.name)?'★':'☆') + ' Favorit');
  fav.setAttribute('aria-pressed', state.favs.has(T.name));
  fav.title = 'Turnier merken und beim Öffnen vorwählen';
  fav.onclick = ()=>{ state.favs.has(T.name) ? state.favs.delete(T.name) : state.favs.add(T.name); render(); };
  sub.appendChild(fav);

  if(state.favs.size){
    const lab = el('span','hint','Favoriten:'); sub.appendChild(lab);
    [...state.favs].forEach(name=>{
      const there = state.tennis.tournaments.some(t=>t.name===name);
      const b = el('button','chip','★ '+esc(name));
      b.setAttribute('aria-pressed', name===T.name);
      if(!there){ b.disabled = true; b.style.opacity = .45; b.title = 'Gerade kein Turnier dieses Namens im Zeitraum'; }
      else b.onclick = ()=>{ state.tennis.pick=name; state.tennis.group=null; state.tennis.from=null; state.scrollLeft=0; load(true); };
      sub.appendChild(b);
    });
  }

  [...T.groups.keys()].forEach(g=>{
    const b=el('button','chip',esc(g));
    b.setAttribute('aria-pressed', g===state.tennis.group);
    b.onclick=()=>{ state.tennis.group=g; state.tennis.from=null; state.scrollLeft=0; render(); };
    sub.appendChild(b);
  });
  const lv=el('button','chip','Nur live');
  lv.setAttribute('aria-pressed', state.tennis.onlyLive);
  lv.onclick=()=>{ state.tennis.onlyLive=!state.tennis.onlyLive; state.tennis.allLive=false; render(); };
  sub.appendChild(lv);

  let liveAll = 0;
  T.groups.forEach(list=>list.forEach(c=>{ if(c.status?.type?.state==='in') liveAll++; }));
  const al=el('button','chip',`● Alle live${liveAll?' ('+liveAll+')':''}`);
  al.setAttribute('aria-pressed', state.tennis.allLive);
  al.title='Alle laufenden Partien dieses Turniers, unabhängig vom Wettbewerb';
  al.onclick=()=>{ state.tennis.allLive=!state.tennis.allLive; state.tennis.onlyLive=false; render(); };
  sub.appendChild(al);

  if(state.tennis.allLive){
    state.tennis.byId = new Map();
    const buckets = new Map();
    T.groups.forEach((list,g)=>list.forEach(c=>{
      if(c.status?.type?.state !== 'in') return;
      state.tennis.byId.set(String(c.id), c);
      if(!buckets.has(g)) buckets.set(g,[]);
      buckets.get(g).push(c);
    }));
    if(!buckets.size){
      view.className='empty';
      view.textContent='In diesem Turnier läuft gerade keine Partie.';
      return;
    }
    view.innerHTML = [...buckets.entries()].map(([g,list])=>`
      <section style="margin-bottom:22px">
        <h3 class="sec">${esc(g)} · ${list.length} live</h3>
        <div class="livegrid">${list.map(c=>{
          const r = roundDE(rawRound(c));
          return matchCard(c).replace('<div class="mtop">', `<div class="mtop"><span>${esc(r)}</span>`);
        }).join('')}</div>
      </section>`).join('');
    view.querySelectorAll('.m').forEach(m=>{ m.onclick = ()=>openMatch(m.dataset.mid); });
    return;
  }

  // Runden bilden und verketten
  state.tennis.byId = new Map();
  const byRound = new Map();
  (T.groups.get(state.tennis.group)||[]).forEach(c=>{
    state.tennis.byId.set(String(c.id), c);
    const r=rawRound(c); if(!byRound.has(r)) byRound.set(r,[]); byRound.get(r).push(c);
  });
  let rounds = [...byRound.entries()].sort((x,y)=>roundRank(x[0])-roundRank(y[0]))
                 .map(([name,list])=>({name, list}));
  linkRounds(rounds);

  if(!rounds.length){ view.className='empty'; view.textContent='Keine Partien in dieser Auswahl.'; return; }

  // Startrunde: erste Runde mit hoechstens 16 Partien, damit der Baum nicht ausufert
  let fromIdx = rounds.findIndex(r=>r.name===state.tennis.from);
  if(fromIdx<0){
    fromIdx = rounds.findIndex(r=>r.list.length<=16);
    if(fromIdx<0) fromIdx = 0;
    state.tennis.from = rounds[fromIdx].name;
  }
  let shown = rounds.slice(fromIdx);
  if(state.tennis.onlyLive)
    shown = shown.map(r=>({name:r.name, list:r.list.filter(c=>c.status?.type?.state==='in')})).filter(r=>r.list.length);
  if(!shown.length){ view.className='empty'; view.textContent='Gerade läuft in dieser Auswahl kein Match.'; return; }

  const seen = {}, total = {};
  rounds.forEach(r=>{ const l=roundDE(r.name); total[l]=(total[l]||0)+1; });
  const labels = rounds.map(r=>{
    const l = roundDE(r.name);
    if(total[l] < 2) return l;
    seen[l] = (seen[l]||0)+1;
    return `${l} ${seen[l]}`;
  });

  const maxCount = Math.max(...shown.map(r=>r.list.length));
  const H = Math.max(3, maxCount) * 96;

  view.innerHTML =
    `<nav class="roundnav"><b>Ab Runde:</b>${rounds.map((r,i)=>
        `<button data-from="${i}" class="${i===fromIdx?'on':''}">${esc(labels[i])}</button>`).join('')}
        <span class="zoom"><button data-zoom="out" title="Kleiner">−</button>
        <span id="zoomlbl">100%</span>
        <button data-zoom="in" title="Größer">+</button>
        <button data-zoom="fit">Ganz zeigen</button></span></nav>
     <div class="draw"><div class="sizer"><div class="canvas" style="--h:${H}px">
       <svg class="links" aria-hidden="true"></svg>
       ${shown.map(r=>`<section class="col">
          <div class="colhead"><span>${esc(roundDE(r.name))}</span><i>${r.list.length}</i></div>
          <div class="slots">${r.list.map(matchCard).join('')}</div>
        </section>`).join('')}
     </div></div></div>
     <p class="hint" style="margin:8px 2px 0">Strg und Mausrad zoomt, Ziehen verschiebt. Am Handy ein Finger zum Scrollen, zwei zum Zoomen.</p>`;

  const draw = view.querySelector('.draw');
  enableGestures(draw);
  draw.scrollLeft = state.scrollLeft || 0; draw.scrollTop = state.scrollTop || 0;
  view.querySelectorAll('.m').forEach(m=>{ m.onclick = ()=>openMatch(m.dataset.mid); });
  view.querySelectorAll('[data-from]').forEach(b=>{
    b.onclick=()=>{
      state.tennis.from = rounds[Number(b.dataset.from)].name;
      state.scrollLeft = 0; render();
    };
  });
  view.querySelectorAll('[data-zoom]').forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.zoom;
      state.zoom = k==='fit' ? null
        : Math.min(2, Math.max(0.25, state.zoomEff + (k==='in'?0.1:-0.1)));
      layoutDraw();
    };
  });
  requestAnimationFrame(layoutDraw);
}

const EV_ICON = t => /goal|tor/i.test(t)?'⚽': /yellow/i.test(t)?'🟨': /red/i.test(t)?'🟥': /sub/i.test(t)?'🔁': /penalty/i.test(t)?'🎯':'•';

function gameRow(ev){
  const c = ev.competitions?.[0]; if(!c) return '';
  const st = c.status?.type?.state, live = st==='in', done = st==='post';
  const home = (c.competitors||[]).find(x=>x.homeAway==='home') || c.competitors?.[0] || {};
  const away = (c.competitors||[]).find(x=>x.homeAway==='away') || c.competitors?.[1] || {};
  const d = new Date(ev.date);
  const when = live ? `<span class="when lv num">${esc(c.status?.displayClock||'live')}</span>`
             : done ? `<span class="when">Endstand</span>`
                    : `<span class="when num">${fmtTime(d)}</span>`;
  const bar = t => t.team?.color ? `<i class="cdot" style="background:#${esc(t.team.color)}"></i>` : '';
  const logo = t => t.team?.logo ? `<img src="${esc(t.team.logo)}" alt="" loading="lazy">` : '';
  const nm   = t => `<span>${esc(t.team?.shortDisplayName||t.team?.displayName||'?')}</span>`;
  const tm = (t,side)=> side==='a'
    ? `<div class="team a">${nm(t)}${logo(t)}${bar(t)}</div>`
    : `<div class="team b">${bar(t)}${logo(t)}${nm(t)}</div>`;
  const score = (live||done)
    ? `<span class="score num">${esc(home.score??'')} : ${esc(away.score??'')}</span>`
    : `<span class="score pre">gegen</span>`;
  const place = [c.venue?.fullName, c.venue?.address?.city].filter(Boolean).join(', ');
  const open = state.league.open.has(ev.id);
  const tick = open ? renderTicker(ev.id) : '';
  return `<button class="game ${live?'is-live':''} ${done?'is-done':''}" data-ev="${esc(ev.id)}">
    <div class="grow">${when}${tm(home,'a')}${score}${tm(away,'b')}</div>
    ${place?`<div class="venue">${esc(place)}</div>`:''}
    ${tick}
  </button>`;
}
function renderTicker(id){
  const t = state.league.tickers.get(id);
  if(t===undefined) return `<div class="ticker"><div class="tk"><span></span><span></span><span>Ticker wird geladen…</span></div></div>`;
  if(!t || !t.length) return `<div class="ticker"><div class="tk"><span></span><span></span><span>Noch keine Ereignisse.</span></div></div>`;
  return `<div class="ticker">${t.map(e=>`<div class="tk">
      <span class="num">${esc(e.clock)}</span><span>${EV_ICON(e.type)}</span>
      <span><b>${esc(e.who)}</b> ${esc(e.text)}</span></div>`).join('')}</div>`;
}
async function loadTicker(id){
  state.league.tickers.set(id, undefined); render();
  try{
    const d = await getJSON(`${API}${state.sport.path}/summary?event=${id}`);
    const raw = d.keyEvents || d.plays || [];
    const items = raw.filter(e=>e.type?.text && !/^end |^kick|start/i.test(e.type.text)).map(e=>({
      clock: e.clock?.displayValue || '',
      type: e.type?.text || '',
      who: (e.athletesInvolved||[])[0]?.displayName || e.team?.displayName || '',
      text: e.type?.text || e.text || ''
    })).reverse();
    state.league.tickers.set(id, items);
  }catch(err){ state.league.tickers.set(id, []); }
  render();
}

    <td class="r num">${esc(val(e,'gamesPlayed'))}</td>

function renderLeague(){

    next.onclick=()=>{ state.league.weekOffset++; load(); };
    sub.appendChild(prev); sub.appendChild(next);

      const now=el('button','chip','Heute'); now.onclick=()=>{ state.league.weekOffset=0; load(); }; sub.appendChild(now);

      : '<div class="empty">Für diesen Wettbewerb liefert die Quelle gerade keine Torjägerliste.</div>';

  if(!evs.length){ view.className='empty'; view.textContent='In diesem Zeitraum sind keine Spiele angesetzt.'; return; }

  evs.forEach(e=>{ const k=dayKey(new Date(e.date)); if(!days.has(k)) days.set(k,[]); days.get(k).push(e); });
  view.innerHTML = [...days.entries()].map(([k,list])=>`
    <section class="day">
      <div class="dayhead">${esc(fmtDay(new Date(list[0].date)))}</div>
      ${list.map(gameRow).join('')}
    </section>`).join('');

  view.querySelectorAll('[data-ev]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.ev;
      if(state.league.open.has(id)){ state.league.open.delete(id); render(); }
      else { state.league.open.add(id); if(!state.league.tickers.has(id)) loadTicker(id); else render(); }
    };

};
const statDE = l => STAT_DE[String(l).toLowerCase()] || l;

function pullStats(d, cid){
  const comps = Array.isArray(d?.competitions) ? d.competitions : [];
  const match = comps.find(c=>String(c.id)===String(cid)) || comps[0];
  const cps = match?.competitors || d?.boxscore?.players || d?.competitors || [];
  const rows = new Map();
  cps.slice(0,2).forEach((cp,i)=>{
    let raw = cp.statistics || cp.stats || [];
    if(Array.isArray(raw) && raw.length && Array.isArray(raw[0]?.stats)) raw = raw.flatMap(g=>g.stats);
    (raw||[]).forEach(st=>{
      const label = st.displayName || st.label || st.name; if(!label) return;
      if(!rows.has(label)) rows.set(label, ['','']);
      rows.get(label)[i] = st.displayValue ?? st.value ?? '';
    });
  });
  return [...rows.entries()].filter(([,v])=>v[0]!=='' || v[1]!=='');
}

async function coreStats(key, evid, cid){
  const base = `https://sports.core.api.espn.com/v2/sports/tennis/leagues/${key}/events/${evid}/competitions/${cid}/competitors`;
  const d = await getJSON(base);
  const items = (d.items || []).slice(0,2);
  const rows = new Map();
  for(let i=0;i<items.length;i++){
    let c = items[i];
    if(c.$ref) c = await getJSON(c.$ref.replace('http://','https://'));
    const sref = c.statistics?.$ref; if(!sref) continue;
    const st = await getJSON(sref.replace('http://','https://'));
    const cats = st.splits?.categories || st.categories || [];
    cats.forEach(cat=>(cat.stats||[]).forEach(x=>{
      const l = x.displayName || x.name; if(!l) return;
      if(!rows.has(l)) rows.set(l, ['','']);
      rows.get(l)[i] = x.displayValue ?? x.value ?? '';
    }));
  }
  return [...rows.entries()].filter(([,v])=>v[0]!=='' || v[1]!=='');
}

function cleanDetail(c){
  const d = c.status?.type?.detail || '';
  if(!d || /TBD|M\/d|\bd\/M\b|'/.test(d)) return '';
  return d;
}

// Aus dem Satzverlauf ableitbare Zahlen, unabhaengig von der Quelle
function localStats(c){
  const cps = (c.competitors||[]).slice(0,2);
  if(cps.length < 2) return [];
  const ls = cps.map(cp=>cp.linescores||[]);
  const n = Math.max(ls[0].length, ls[1].length);
  if(!n) return [];
  const sets=[0,0], games=[0,0]; let tb=[0,0], tbPlayed=0;
  for(let i=0;i<n;i++){
    const a = Number(ls[0][i]?.value), b = Number(ls[1][i]?.value);
    if(!Number.isFinite(a) || !Number.isFinite(b)) continue;
    games[0]+=a; games[1]+=b;
    if(a>b) sets[0]++; else if(b>a) sets[1]++;
    const ta = ls[0][i]?.tiebreak ?? ls[0][i]?.tieBreak;
    const tbb = ls[1][i]?.tiebreak ?? ls[1][i]?.tieBreak;
    if(ta!=null || tbb!=null){
      tbPlayed++;
      if(Number(ta) > Number(tbb)) tb[0]++; else if(Number(tbb) > Number(ta)) tb[1]++;
    }
  }
  const rows = [['Sätze', [sets[0], sets[1]]], ['Spiele gesamt', [games[0], games[1]]]];
  if(tbPlayed) rows.push(['Tiebreaks gewonnen', [tb[0], tb[1]]]);
  const diff = games[0]-games[1];
  rows.push(['Spieldifferenz', [diff>0?'+'+diff:diff, diff<0?'+'+(-diff):-diff]]);
  return rows;
}

async function openMatch(id){
  const c = state.tennis.byId.get(id); if(!c) return;
  const d = c.date ? new Date(c.date) : null;
  const st = c.status?.type?.state;
  const line = cp => `<div class="dt ${cp.winner?'w':''}">
      ${playerFlag(cp)}<span class="nm">${esc(playerName(cp))}</span>
      ${(cp.seed||cp.athlete?.seed)?`<span class="sd">(${esc(cp.seed||cp.athlete.seed)})</span>`:''}
      <span class="sets num">${(cp.linescores||[]).map(setBox).join('')}</span></div>`;
  const court = courtOf(c);
  $('#sheet').innerHTML = `
    <h2>${esc(roundDE(rawRound(c)))}</h2>
    <div class="ver">${esc(c.__event||'')} · ${esc(c.__tour||'')}</div>
    ${(c.competitors||[]).map(line).join('')}
    <p class="meta">
      ${d ? esc(fmtDay(d)) + ', ' + esc(fmtTime(d)) + ' Uhr' : 'Termin offen'}
      ${court ? ' · ' + esc(court) : ''}
      ${cleanDetail(c) ? ' · ' + esc(cleanDetail(c)) : ''}
      ${st==='in' ? ' · läuft gerade' : ''}
    </p>
    <h3>Zahlen zur Partie</h3>
    <div id="stats"><p>wird geladen…</p></div>
    <button class="iconbtn" id="closesheet">Schließen</button>`;
  $('#modal').hidden = false;
  $('#closesheet').onclick = closeSettings;

  const key = c.__key || 'atp';
  const cand = [
    `${API}tennis/${key}/summary?event=${encodeURIComponent(c.id)}`,
    `${API}tennis/${key}/summary?event=${encodeURIComponent(c.__evid||'')}&competition=${encodeURIComponent(c.id)}`,
    `https://site.web.api.espn.com/apis/site/v2/sports/tennis/${key}/summary?event=${encodeURIComponent(c.__evid||'')}&competition=${encodeURIComponent(c.id)}`
  ];
  let rows = [];
  for(const u of cand){
    try{ const sum = await getJSON(u); rows = pullStats(sum, c.id); if(rows.length) break; }catch(e){}
  }
  if(!rows.length && c.__evid){
    try{ rows = await coreStats(key, c.__evid, c.id); }catch(e){}
  }
  const box = $('#stats'); if(!box) return;
  let note = '';
  if(!rows.length){
    if(st === 'pre'){
      box.innerHTML = '<p>Die Partie wurde noch nicht gespielt.</p>';
      return;
    }
    rows = localStats(c);
    note = '<p style="margin-top:10px">Aces, Doppelfehler und Aufschlagquoten gibt die Quelle nicht heraus. '
         + 'Die Zahlen oben sind aus dem Satzverlauf berechnet.</p>';
  }
  box.innerHTML = rows.length
    ? rows.map(([l,v])=>`<div class="st"><span class="a num">${esc(v[0])}</span>
        <span class="lb">${esc(statDE(l))}</span><span class="num">${esc(v[1])}</span></div>`).join('') + note
    : '<p>Zu dieser Partie liegen keine Zahlen vor.</p>';
}

function renderSettings(){
  const saved = readPrefs();
  $('#sub').innerHTML = '';
  const back = el('button','chip','← Zurück');
  back.onclick = ()=>{ state.page='app'; render(); };
  $('#sub').appendChild(back);
  const view = $('#view'); view.className='';
  view.innerHTML = `
    <div class="page">
      <h2 class="ttl">Einstellungen</h2>
      <p class="hint">TorSpo Version ${esc(APP.version)}</p>

      <h3 class="sec">Gespeicherte Auswahl</h3>
      <p>${saved.sport
          ? 'Zuletzt geöffnet: ' + esc(SPORTS.find(x=>x.id===saved.sport)?.label || saved.sport)
            + (saved.pick ? ', ' + esc(saved.pick) : '')
            + '<br>Favoriten: ' + (state.favs.size ? esc([...state.favs].join(', ')) : 'keine')
          : 'Noch nichts gespeichert. Ansicht, Turnier, Zoom und Favoriten werden auf diesem Gerät gemerkt.'}</p>
      <button class="iconbtn" id="clearprefs">Gespeicherte Auswahl löschen</button>

      <h3 class="sec">Was ist neu</h3>
      ${APP.notes.map((n,i)=>`<details class="rel ${i===0?'now':''}">
        <summary>Version ${esc(n.v)}${i===0?' <span class="tag">aktuell</span>':''}</summary>
        <ul>${n.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`).join('')}

      <h3 class="sec">Datenquelle</h3>
      <p>Alle Ergebnisse kommen live von den offenen ESPN-Schnittstellen. Die Grand-Slam-Bestenliste
      wird im Script von Hand gepflegt, Stand ${esc(SLAMS.stand)}.</p>
    </div>`;
  $('#clearprefs').onclick = ()=>{
    try{ localStorage.removeItem(STORE); }catch(e){}
    state.favs.clear(); state.zoom=null; state.tennis.from=null;
    render();
  };
}

function openSettings(){
  const saved = readPrefs();
  $('#sheet').innerHTML = `
    <h2>TorSpo</h2>
    <div class="ver">Version ${esc(APP.version)}</div>
    <h3>Gespeicherte Auswahl</h3>
    <p>${saved.sport
        ? 'Zuletzt geöffnet: ' + esc(SPORTS.find(x=>x.id===saved.sport)?.label || saved.sport)
          + (saved.pick ? ', ' + esc(saved.pick) : '')
          + '. Favoriten: ' + (state.favs.size ? esc([...state.favs].join(', ')) : 'keine')
        : 'Noch nichts gespeichert. Ansicht, Turnier, Zoom und Favoriten werden auf diesem Gerät gemerkt.'}</p>
    <button class="iconbtn" id="clearprefs">Gespeicherte Auswahl löschen</button>
    <h3>Was ist neu</h3>
    ${APP.notes.map((n,i)=>`<div class="rel ${i===0?'now':''}">
      <b>${esc(n.v)}</b><ul>${n.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}
    <button class="iconbtn" id="closesheet">Schließen</button>`;
  $('#modal').hidden = false;
  $('#closesheet').onclick = closeSettings;
  $('#clearprefs').onclick = ()=>{
    try{ localStorage.removeItem(STORE); }catch(e){}
    state.favs.clear(); state.zoom=null; state.tennis.from=null;
    closeSettings(); render();
  };
}
function closeSettings(){ $('#modal').hidden = true; }

function render(){
  const y = window.scrollY;
  const d = document.querySelector('.draw');
  if(d){ state.scrollLeft = d.scrollLeft; state.scrollTop = d.scrollTop; }
  renderInner();
  const nd = document.querySelector('.draw');
  if(nd){ nd.scrollLeft = state.scrollLeft; nd.scrollTop = state.scrollTop; }
  if(state.swap){
    const v = $('#view');
    if(v){ v.classList.remove('swap'); void v.offsetWidth; v.classList.add('swap'); }
    state.swap = false;
  }
  if(window.scrollY !== y) window.scrollTo(0, y);
  savePrefs();
}

function renderInner(){
  renderTabs();
  $('#crumb').textContent = state.sport.kind==='draw'
    ? (state.tennis.pick || 'Turniere')
    : (state.league.view==='tabelle' ? 'Tabelle' : 'Spieltag');
  if(state.error){
    $('#sub').innerHTML=''; $('#view').className='';
    $('#view').innerHTML = `<div class="err"><b>Daten konnten nicht geladen werden.</b><br>${esc(state.error)}
      <br><br>Meist hilft ein erneutes Laden. Bleibt der Fehler bestehen, blockiert vermutlich das Netzwerk die ESPN-Schnittstelle.</div>`;
    return;
  }
  if(state.loading && !state.lastLoad){ $('#view').className='skel'; $('#view').textContent='Daten werden geladen…'; return; }
  if(state.page==='settings'){ renderSettings(); return; }
  if(state.sport.kind==='draw') renderTennis(); else renderLeague();
}

function signature(){
  if(state.sport.kind==='draw')
    return state.tennis.tournaments.map(t=>t.name+'#'+[...t.groups.values()].flat().map(c=>
      c.id+(c.status?.type?.detail||'')+(c.competitors||[]).map(cp=>
        (cp.winner?'W':'')+(cp.linescores||[]).map(l=>l.value).join('-')).join('|')).join(',')).join(';');
  return state.league.events.map(e=>{
    const c=e.competitions?.[0]||{};
    return e.id+(c.status?.type?.state||'')+(c.status?.displayClock||'')
      +(c.competitors||[]).map(x=>x.score).join('-');
  }).join(';');
}

async function load(force=true){
  state.loading=true; state.loadStart=Date.now(); state.error=null;
  if(force && !state.lastLoad) render();
  tickClock();
  try{
    if(state.sport.kind==='draw') await loadTennis(); else await loadLeague();
    state.lastLoad = Date.now();
  }catch(err){ state.error = err.message || String(err); }
  state.loading=false;
  const sp = document.getElementById('splash');
  if(sp){ sp.classList.add('gone'); setTimeout(()=>sp.remove(), 500); }
  const sig = signature(), changed = sig !== state.sig;
  state.sig = sig;
  if(force || changed || state.error) render(); else requestAnimationFrame(layoutDraw);
  tickClock();
}

function tickClock(){
  const dot=$('#dot'), stamp=$('#stamp');
  dot.className = 'dot' + (state.loading?'':(state.hasLive?' live':' on'));
  if(state.loading){ stamp.textContent='lädt…'; return; }
  if(!state.lastLoad){ stamp.textContent='—'; return; }
  const s = Math.round((Date.now()-state.lastLoad)/1000);
  stamp.textContent = (state.hasLive?'live · ':'') + (s<60?`vor ${s}s`:`vor ${Math.round(s/60)} min`);
}

$('#reload').onclick = ()=>load(true);
document.title = `TorSpo ${APP.version}`;
(function(){ const a=document.querySelector('.mark'), b=document.getElementById('splashball');
  if(a&&b) b.src=a.src; })();
try{
  const icon = document.querySelector('link[rel="apple-touch-icon"]').href;
  const mf = { name:'TorSpo', short_name:'TorSpo', start_url:'.', display:'standalone',
    background_color:'#f5f7f1', theme_color:'#00703c',
    icons:[{src:icon, sizes:'180x180', type:'image/png', purpose:'any'}] };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:'application/manifest+json'}));
  document.head.appendChild(l);
}catch(e){}
const verEl = $('#appver'); if(verEl) verEl.textContent = `v${APP.version}`;

function goHome(){
  closeSettings();
  state.page='app';
  state.sport = SPORTS[0];
  state.tennis.pick = null; state.tennis.group = null; state.tennis.from = null; state.tennis.onlyLive = false;
  state.league.view = 'spiele'; state.league.weekOffset = 0;
  state.zoom = null; state.scrollLeft = 0;
  window.scrollTo(0,0);
  load(true);
}
$('#home').onclick = goHome;
$('#settings').onclick = ()=>{ state.page = state.page==='settings' ? 'app' : 'settings'; window.scrollTo(0,0); render(); };
$('#modal').onclick = e=>{ if(e.target.id==='modal') closeSettings(); };
addEventListener('keydown', e=>{ if(e.key==='Escape') closeSettings(); });
addEventListener('resize', ()=>requestAnimationFrame(layoutDraw));
setInterval(tickClock, 1000);
setInterval(()=>{                       // Auto-Refresh: 30s wenn live, sonst 3 min
  if(state.loading){
    if(Date.now() - (state.loadStart||0) > 25000){ state.loading = false; }
    return;
  }
  const wait = state.hasLive ? 30000 : 180000;
  if(Date.now()-state.lastLoad > wait) load(false);
}, 5000);

// Gespeicherte Auswahl übernehmen
(function restore(){
  const p = readPrefs();
  if(Array.isArray(p.favs)) state.favs = new Set(p.favs);
  const sp = SPORTS.find(x=>x.id===p.sport); if(sp) state.sport = sp;
  if(p.pick) state.tennis.pick = p.pick;
  if(p.group) state.tennis.group = p.group;
  if(p.from) state.tennis.from = p.from;
  if(typeof p.zoom === 'number') state.zoom = p.zoom;
  if(p.lview) state.league.view = p.lview;
  if(p.tview) state.tennis.view = p.tview;
})();

load();
</script>
